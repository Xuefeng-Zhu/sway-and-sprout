plugins { id 'com.android.application' }
// Optional frozen calibration assets authorize only this exact manifest at compile time.
def calibrationPinFile = rootProject.file('../.toolchain/native-calibration/pin.json')
def calibrationEnabled = false
def calibrationSha = ''
def calibrationBytes = 0
def calibrationId = 'unprepared'
if (calibrationPinFile.exists()) {
 if (java.nio.file.Files.isSymbolicLink(calibrationPinFile.toPath())) throw new GradleException('Calibration pin must be a regular file.')
 def pin = new groovy.json.JsonSlurper().parse(calibrationPinFile)
 if (pin.schemaVersion != 1 || !(pin.manifestSha256 instanceof String) || !(pin.manifestSha256 ==~ /[0-9a-f]{64}/) ||
     !(pin.manifestBytes instanceof Number) || pin.manifestBytes.longValue() != pin.manifestBytes.doubleValue() ||
     pin.manifestBytes < 1 || pin.manifestBytes > 4194304 || !(pin.datasetId instanceof String) ||
     !(pin.datasetId ==~ /dataset-[0-9a-f]{16}/)) throw new GradleException('Invalid frozen calibration pin.')
 def manifest = rootProject.file('app/src/debug/assets/calibration/manifest.json')
 if (!manifest.isFile() || java.nio.file.Files.isSymbolicLink(manifest.toPath()) || manifest.length() != pin.manifestBytes ||
     java.security.MessageDigest.getInstance('SHA-256').digest(manifest.bytes).encodeHex().toString() != pin.manifestSha256 ||
     pin.datasetId != 'dataset-' + pin.manifestSha256.substring(0, 16)) throw new GradleException('Restore exact frozen calibration assets with scripts/prepare-native-calibration.py.')
 calibrationEnabled = true; calibrationSha = pin.manifestSha256; calibrationBytes = pin.manifestBytes.intValue(); calibrationId = pin.datasetId
}
android {
 namespace 'com.togethermove.tv'
 compileSdk 35
 defaultConfig { applicationId 'com.togethermove.tv'; minSdk 25; targetSdk 35; versionCode 1; versionName '1.0.0' }
 buildFeatures { buildConfig true }
 androidResources { noCompress += ['tflite', 'mp4'] }
 buildTypes {
  debug {
   applicationIdSuffix '.motion'; versionNameSuffix '-motion'
   buildConfigField 'boolean', 'NATIVE_CALIBRATION_ENABLED', String.valueOf(calibrationEnabled)
   buildConfigField 'String', 'NATIVE_CALIBRATION_DATASET_ID', '"' + calibrationId + '"'
   buildConfigField 'String', 'NATIVE_CALIBRATION_MANIFEST_SHA256', '"' + calibrationSha + '"'
   buildConfigField 'int', 'NATIVE_CALIBRATION_MANIFEST_BYTES', String.valueOf(calibrationBytes)
  }
 }
}

// Explicitly restored, hash-pinned local Google artifacts; release contains no ML runtime.
dependencies {
 debugImplementation files(rootProject.file('../.toolchain/native-runtime/litert-1.4.2.aar'))
 debugImplementation files(rootProject.file('../.toolchain/native-runtime/litert-api-1.4.2.aar'))
 debugImplementation files(rootProject.file('../.toolchain/native-runtime/tensorflow-lite-support-api-0.4.4.aar'))
}

// Do not silently substitute another local AAR while claiming the pinned runtime.
def nativeVideoDependencies = tasks.register('verifyNativeVideoDependencies') {
 doLast {
  def lock = new groovy.json.JsonSlurper().parse(rootProject.file('native-video-assets.lock.json'))
  lock.artifacts.findAll { it.role in ['core', 'api', 'image-reference-api'] }.each { pin ->
   def artifact = rootProject.file('../' + pin.target)
   if (!artifact.isFile() || artifact.length() != pin.bytes ||
       java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString() != pin.sha256)
    throw new GradleException('Restore pinned native artifacts explicitly with scripts/prepare-native-video.py before building debug.')
  }
 }
}
tasks.configureEach { if (name == 'preDebugBuild') dependsOn(nativeVideoDependencies) }
